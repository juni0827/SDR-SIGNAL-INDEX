[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sdr-signal-index"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.41,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary,pool]>=3.2.9,<4",
  "pgvector>=0.4.1,<0.5",
  "redis>=6.2,<7",
  "celery>=5.5,<6",
  "boto3>=1.39,<2",
  "python-multipart>=0.0.20,<0.1",
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<0.29",
  "feedparser>=6,<7",
  "beautifulsoup4>=4.13,<5",
  "structlog>=25.4,<26",
  "orjson>=3.11,<4"
]

[project.optional-dependencies]
audio = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14", "Pillow>=11.3,<12",
  "faster-whisper>=1.1,<2", "torch>=2.7,<3", "torchaudio>=2.7,<3",
  "silero-vad>=6,<7"
]
dev = [
  "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13", "mypy>=1.17,<2"
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/signal_index",
  "workers/audio_processor/audio_processor",
  "packages/source_adapters/source_adapters",
  "packages/signal_processing/signal_processing"
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
markers = ["integration: requires Docker services"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S108", "S311", "S603", "S607", "E501", "B008", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
exclude = ["infra/migrations"]
