name: signal-index

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  APP_URL: ${APP_URL:-http://localhost:3000}
  API_URL: ${API_URL:-http://localhost:8000}
  DATABASE_URL: postgresql+psycopg://signal:signal@postgres:5432/signal
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: auto
  S3_BUCKET: ${S3_BUCKET:-signal-index}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-miniosecret}
  S3_SECURE: "false"
  SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-this-value}
  JWT_SECRET: ${JWT_SECRET:-development-jwt-secret-change-this-value}
  TOOL_API_KEY: ${TOOL_API_KEY:-development-agent-key-change-this-value}
  FIRST_USER_EMAIL: ${FIRST_USER_EMAIL:-owner@local.test}
  FIRST_USER_PASSWORD: ${FIRST_USER_PASSWORD:-change-this-password}
  ACCOUNT_ALLOWLIST: ${ACCOUNT_ALLOWLIST:-owner@local.test}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  FFMPEG_PATH: ffmpeg
  FFPROBE_PATH: ffprobe
  ASR_MODEL: ${ASR_MODEL:-large-v3}
  ASR_DEVICE: ${ASR_DEVICE:-auto}
  ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-auto}
  LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
  LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:1234/v1}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
  LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-local}
  PIPELINE_VERSION: ${PIPELINE_VERSION:-1.0.0}
  MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      TZ: UTC
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miniosecret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minio} ${S3_SECRET_KEY:-miniosecret} && mc mb --ignore-existing local/${S3_BUCKET:-signal-index} && mc anonymous set none local/${S3_BUCKET:-signal-index}"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["8000:8000"]
    command:
      [
        "/bin/sh",
        "-c",
        "alembic -c infra/migrations/alembic.ini upgrade head && uvicorn signal_index.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment: *api-env
    depends_on:
      api: {condition: service_healthy}
    volumes: [hf_cache:/models]
    command: ["celery", "-A", "audio_processor.celery_app:celery", "worker", "--loglevel=INFO", "--concurrency=1"]

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment: *api-env
    depends_on:
      api: {condition: service_healthy}
    command: ["celery", "-A", "audio_processor.celery_app:celery", "beat", "--loglevel=INFO"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]

  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware-scan"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hf_cache:
