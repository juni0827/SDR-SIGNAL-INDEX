services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.12-bookworm
    init: true
    working_dir: /workspaces/signal-index
    command: sleep infinity
    volumes:
      - ..:/workspaces/signal-index:cached
      - signal_index_node_modules:/workspaces/signal-index/node_modules

volumes:
  signal_index_node_modules:
